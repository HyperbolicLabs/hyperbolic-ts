name: Release Canary

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!changeset-release/main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow only publishes snapshot versions to npm; it does not push commits
# or tags back to the repository, so the job token does not need write access.
# Declaring the block also stops the job from inheriting a `write-all` default.
permissions:
  contents: read

jobs:
  release:
    if: ${{ github.repository_owner == 'HyperbolicLabs' }}
    name: Release (canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm/node and install dependencies
        uses: ./tooling/github/setup

      - name: Create ENV file
        run: |
          touch .env

      - name: Build
        run: |
          pnpm build:ai-sdk-provider

      - name: Extract Canary Subject From Branch Name
        id: get-canary-subject
        uses: ./tooling/github/get-canary-subject

      - name: Log Canary Subject
        run: |
          echo "Canary subject: ${{ steps.get-canary-subject.outputs.canary-subject }}"

      - name: Setup NPM Authentication
        # See the equivalent step in `release.yml`: writing to the repository's
        # tracked `.npmrc` with `>` both discarded the committed pnpm settings and
        # left the token in the working tree. Write to the user-level file
        # instead, and pass the secret via the environment so it never appears in
        # the rendered command.
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Canary to npm
        run: |
          pnpm changeset version --snapshot ${{ steps.get-canary-subject.outputs.canary-subject }}
          pnpm changeset publish --tag ${{ steps.get-canary-subject.outputs.canary-subject }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
