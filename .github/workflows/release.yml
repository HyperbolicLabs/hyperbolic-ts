name: Code Check and Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Without an explicit block the job token inherits the repository default, which
# is `write-all` on older repositories. Each job is narrowed to what it needs;
# the release job widens it again below.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Test
        run: pnpm test

  release:
    needs: [lint, format, typecheck, test]
    if: ${{ github.repository_owner == 'HyperbolicLabs' }}
    name: Create a PR for release workflow
    runs-on: ubuntu-latest
    # changesets/action pushes the version branch and opens the release PR, so
    # this job needs write access where the rest of the workflow does not.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm/node and install dependencies
        uses: ./tooling/github/setup

      - name: Build the package
        run: pnpm build:ai-sdk-provider

      - name: Setup NPM Authentication
        # The token used to be written to the repository's own `.npmrc` with `>`,
        # which (a) truncated the tracked file and dropped `auto-install-peers`
        # and `link-workspace-packages`, changing how pnpm resolves the
        # workspace, and (b) left a credential in the working tree that
        # changesets/action then stages when it creates the release commit.
        # `$HOME/.npmrc` is read by both npm and pnpm and is outside the repo.
        # The secret is passed through the environment rather than interpolated
        # into the script body, so it is never part of the command line.
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Version PR or Publish to NPM
        id: changesets
        uses: changesets/action@v1.4.1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: node .github/changeset-version.js
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: "production"
